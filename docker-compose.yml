services:

  # ──────────────────────────────────────────────
  # BACKEND  (Node.js + Express + Socket.io)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatly-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env          # ← copy .env.example → .env and fill in values
    environment:
      PORT: 5001
      NODE_ENV: production
      # Override CLIENT_URL so CORS allows the frontend origin
      CLIENT_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      # Persist uploaded files across container restarts
      - uploads_data:/app/uploads
    expose:
      - "5001"                  # internal only; frontend nginx proxies to it
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - chatly-net

  # ──────────────────────────────────────────────
  # FRONTEND  (React + Vite → Nginx)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # These are baked into the JS bundle at build time
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
        VITE_SOCKET_URL:   ${VITE_SOCKET_URL:-http://localhost:3000}
    container_name: chatly-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"   # access app at http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy   # wait for backend to be ready
    networks:
      - chatly-net

# ──────────────────────────────────────────────
# VOLUMES
# ──────────────────────────────────────────────
volumes:
  uploads_data:
    driver: local

# ──────────────────────────────────────────────
# NETWORKS
# ──────────────────────────────────────────────
networks:
  chatly-net:
    driver: bridge
