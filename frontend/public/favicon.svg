<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="chatlyGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="innerBubble" x1="18" y1="20" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="softGlow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Badge Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#chatlyGrad)" filter="url(#softGlow)"/>

  <!-- Subtle glossy highlight line on top edge -->
  <path d="M12 6 C20 5, 44 5, 52 6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Main Speech Bubble Shape -->
  <path d="M18 19 C18 16.7909 19.7909 15 22 15 H42 C44.2091 15 46 16.7909 46 19 V33 C46 35.2091 44.2091 37 42 37 H27.5 L20.5 43.5 C19.67 44.28 18 43.69 18 42.5 V37 C18 37 18 36.5 18 36 V19 Z" fill="url(#innerBubble)"/>

  <!-- Three Glowing Chat Pulse Dots -->
  <circle cx="26" cy="26" r="2.8" fill="#4f46e5"/>
  <circle cx="32" cy="26" r="2.8" fill="#6366f1"/>
  <circle cx="38" cy="26" r="2.8" fill="#818cf8"/>

  <!-- Live Pulse Sparkle on Top-Right Corner -->
  <circle cx="48" cy="14" r="3.5" fill="#22c55e"/>
  <circle cx="48" cy="14" r="5" stroke="#22c55e" stroke-width="1" opacity="0.6"/>
</svg>